services:
  si01:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://si01:${POSTGRES_PASSWORD:-si01}@db/si01
    expose: ["8080"]   # наружу не открыт — только через caddy (HTTPS)
    volumes:
      - ./config:/app/config:ro    # факты и приветствия правятся без пересборки (нужен рестарт)
      - ./prompts:/app/prompts:ro
      - ./evals/results:/app/evals/results   # отчёты evals — сразу на хосте
    depends_on: [db]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-10.193.0.55}   # адрес сервера в VPN; на него выписывается сертификат
    ports:
      - "80:80"     # редирект на https
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # CA и сертификаты — не терять, иначе админам придётся заново ставить корневой
      - caddy_config:/config
    depends_on: [si01]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: si01
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-si01}
      POSTGRES_DB: si01
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
