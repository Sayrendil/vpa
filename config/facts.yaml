# VPA_FACTS — единственный источник истины для SI-01.
# Цены, комнаты, статусы функций и правила меняются ЗДЕСЬ, а не в промпте.
# После правки подними facts_version — он пишется в лог каждого хода.
#
# Значение NEEDS_DECISION означает: правило ещё не принято. SI-01 обязан так и сказать,
# а не придумывать ответ.

facts_version: "2026-10-07.1"

vpa:
  what: >-
    VPA — онлайн-пространство с живыми людьми, тематическими комнатами и AI-помощниками.
    Не курс и не просто чат: можно просто общаться, можно что-то прокачивать (например, медиа).
  culture: >-
    Общение не стерильное: можно спорить, ругаться, материться, быть несогласным и доказывать
    свою точку зрения. Нельзя растаптывать человека как личность (унижение, травля).
    Мат и резкость сами по себе — не нарушение.
  size: >-
    VPA пока небольшое пространство и находится на раннем этапе. Точное число участников не
    называем.
  moderation: >-
    За порядком следят люди и администрация. AI-модерация (Security) пока только планируется.
    Решения по спорным ситуациям и апелляциям принимают люди.

membership:
  price: 2700
  currency: "₽"
  period: "месяц"
  auto_renewal: true
  payment_provider: "Tribute"
  trial: "Пробного/гостевого доступа нет."
  refund: "Возврат денег не предусмотрен."
  discounts: "Скидок и промокодов сейчас нет."
  pre_charge_notice: >-
    Tribute сам предупреждает перед следующим списанием. За сколько именно — не фиксируем.
  cancel: >-
    Отменить продление можно самостоятельно в Tribute, без уговоров. Доступ остаётся до конца
    уже оплаченного периода, следующего списания не будет.
  failed_payment: >-
    Если списание не прошло, Tribute сам повторяет попытки в течение семи дней; если оплата так и
    не прошла — Tribute закрывает доступ. Мгновенно не отключают.
  reschedule: >-
    Перенос даты оплаты ничего не гарантирует: SI-01 передаёт просьбу администрации, решают люди.
  access: >-
    Доступ к комнатам выдаёт и контролирует Tribute после оплаты.

entry:
  order: "проверка, что ты реальный человек → одобрение → ссылка на оплату → оплата в Tribute → вход"
  verification: >-
    Обязательная короткая проверка, что за аккаунтом реальный человек: кружок или голосовое прямо
    сюда, в чат с SI-01. Это не проверка документов. Если ни кружок, ни голосовое не подходят —
    можно попросить проверку созвоном: SI-01 передаёт запрос администрации, контакты не выдаёт,
    администрация свяжется сама.
  refuse_verification: "Без проверки вступить нельзя. Это правило не обсуждается."
  review_time: >-
    Срок проверки не фиксирован. Говорим: «Посмотрим и напишем тебе сюда, как только проверим».
    Никаких «2 часа» или «до вечера».
  who_decides: "Одобряет администрация (люди), не модель."
  after_approval: "Сразу после одобрения SI-01 сам присылает ссылку на оплату Tribute."
  rejection_reasons: >-
    Кроме отказа от проверки, отказать могут при очевидном спаме, скаме, угрозах, если человек
    уже был заблокирован или прямо заявляет, что идёт нарушать правила. Спорный характер или мат
    сами по себе — не причина. После отказа можно обратиться к администрации.
  age: NEEDS_DECISION

