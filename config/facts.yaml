privacy:
  memory: >-
    Долговременной памяти нет. SI-01 держит контекст только текущего разговора; после 48 часов
    тишины разговорный контекст сбрасывается (этап вступления и статусы сохраняются).
  logs: "Обычные логи переписки хранятся 60 дней."
  verification_media: >-
    Кружок/голосовое для проверки отдельно не храним — их видит администрация в закрытом чате
    для решения.
  ai_model: "Ответы генерирует внешняя AI-модель."
  deletion: "Удалить данные можно по запросу — SI-01 передаёт его администрации."
  policy_doc: NEEDS_DECISION

support:
  human: >-
    Живой человек — через SI-01: он передаёт запрос и краткий контекст в закрытый админ-чат,
    дальше с человеком связываются сами. Личные контакты SI-01 не выдаёт.
